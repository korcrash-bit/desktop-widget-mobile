<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#244f45">
  <title>나의 교무수첩 · 바탕화면 위젯</title>
  <link rel="stylesheet" href="app.css">
  <script src="config.js" defer></script>
  <script src="native-bridge.js" defer></script>
  <script src="sync-core.js" defer></script>
  <script src="drive.js" defer></script>
  <script src="vault-crypto.js" defer></script>
  <script src="vault-device.js" defer></script>
  <script src="private-ui.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><div><p class="eyebrow">바탕화면 위젯 · MOBILE</p><h1>나의 교무수첩</h1></div><span id="today"></span></header>
  <main>
    <section class="account card">
      <p id="account">PC에서 쓰는 구글 계정으로 연결하세요.</p>
      <div class="actions"><button id="login">구글 계정 연결</button><button id="sync" class="secondary" disabled>새로고침</button><button id="logout" class="quiet" hidden>로그아웃</button></div>
      <p id="status" role="status" aria-live="polite">처음에는 PC 설정에서 모바일 동기화를 켜주세요.</p>
      <p id="conflict" role="alert" hidden></p>
      <a id="demo-link" href="?demo=1">연결 없이 예시 화면 먼저 보기</a>
    </section>
    <nav aria-label="수첩 메뉴" id="tabs">
      <button data-tab="todos" aria-pressed="true">할 일</button><button data-tab="memos" aria-pressed="false">메모</button><button data-tab="progress" aria-pressed="false">진도</button><button data-tab="school" aria-pressed="false">시간표·급식</button><button data-tab="roster" aria-pressed="false">명렬</button>
      <button data-tab="contacts" aria-pressed="false">비상연락망</button><button data-tab="vehicles" aria-pressed="false">차량현황</button>
    </nav>
    <section class="card workspace"><div class="section-head"><h2 id="heading">할 일</h2><span id="count"></span></div>
      <p id="hint">연결하면 PC의 자료를 볼 수 있어요.</p>
      <label id="search-label" hidden>이름·반·부서 검색<input id="search" type="search" placeholder="검색어를 입력하세요"></label>
      <div id="content"></div>
      <form id="editor" hidden>
        <h3 id="editor-title">새 항목</h3><div id="fields"></div>
        <div class="actions"><button type="submit">저장</button><button type="button" id="cancel" class="quiet">입력 취소</button></div>
      </form>
    </section>
    <section id="private-panel" class="card" hidden></section>
    <footer>학생 명렬은 조회 전용입니다.<br>교직원 정보는 암호화된 비상연락망에서 조회합니다.<br>창을 닫으면 일반 조회 자료와 로그인 토큰이 지워집니다.<br>기기 인증으로 암호화한 등록 정보는 이 브라우저에 남습니다.<br>오프라인 편집은 이 탭이 열린 동안만 보관됩니다.</footer>
  </main>
</body>
</html>
